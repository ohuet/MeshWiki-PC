[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshwiki"
version = "0.1.0"
description = "Offline Wikipedia access over Meshtastic LoRa mesh radio"
requires-python = ">=3.10"
dependencies = [
    "meshtastic",
    "chromadb",
    "sentence-transformers",
    "requests",
    "libzim",
    "pyyaml",
    "apscheduler",
    "beautifulsoup4",
    "lxml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["meshwiki*"]
