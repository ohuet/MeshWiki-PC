meshtastic_timezone: "Indian/Reunion"

meshtastic:
  connection: "serial"        # "serial" ou "ble"
  #port: "/dev/ttyUSB0"        # port série ou adresse MAC BLE
  trigger_prefix: "?"         # préfixe pour déclencher une requête
  response_delay: 2.5         # secondes entre chaque chunk de réponse
  max_response_chunks: 5      # nombre max de messages par réponse

rate_limiting:
  max_requests: 10              # nombre de requêtes autorisées par fenêtre
  window_seconds: 600           # durée de la fenêtre en secondes (600 = 10 min)

wikipedia:
  source_format: "zim"

embeddings:
  model: "BAAI/bge-m3"
  embedding_dim: 1024         # dimension des embeddings du modèle
  chunk_size: 500             # tokens par chunk d'article
  chunk_overlap: 50           # chevauchement entre chunks
  # Encodage distant via API OpenAI-compatible (pour accélérer l'indexation sur GPU)
  # Utilisé UNIQUEMENT pour l'indexation, pas pour les requêtes RAG.
  remote:
    base_url: "http://gpu-server:11434"   # URL du serveur Ollama distant
    api_type: "ollama"                   # "openai" ou "ollama"
    model: "bge-m3"                      # Nom du modèle sur le serveur distant
    #api_key: "sk-..."                   # Clé API (Bearer token), optionnelle
    batch_size: 1024                     # Taille des sous-lots envoyés à l'API
    timeout: 300                        # Timeout par requête en secondes
    max_concurrent: 1                   # Requêtes distantes en parallèle
    local_workers: 1                     # GPU local en parallèle (0 = remote seul)

vectordb:
  path: "./data/chroma_db"

ollama:
  base_url: "http://localhost:11434"
  #model: "phi4-mini:3.8b"
  #model: "qwen2.5:3b"                # ou phi4-mini:3.8b, mistral, llama3...
  model: "mistral:7b"
  temperature: 0.1
  max_tokens: 300

updater:
  enabled: true
  interval_days: 30
  check_on_startup: true
  allowed_hours: [2, 6]       # fenêtre horaire pour DL/indexation (2h-6h)
  kiwix_url: "https://download.kiwix.org/zim/wikipedia/?C=M;O=D"
  dump_pattern: "wikipedia_fr_all_mini_"  # pattern du nom de fichier à chercher
  temp_dir: "./data/tmp"
  max_download_retries: 3
  download_timeout_hours: 24
